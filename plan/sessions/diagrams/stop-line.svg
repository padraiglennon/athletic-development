<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="349" rx="6" fill="#fcfcf8" stroke="#d8d8d0"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#22262b">Stop line at 10 metres, five metres to run off</text>

  <g stroke="#c6c6bd" stroke-width="1.5" stroke-dasharray="3 9" stroke-linecap="round">
    <line x1="122" y1="80" x2="428" y2="80"/><line x1="122" y1="106" x2="428" y2="106"/>
    <line x1="122" y1="132" x2="428" y2="132"/><line x1="122" y1="158" x2="428" y2="158"/>
    <line x1="122" y1="184" x2="428" y2="184"/><line x1="122" y1="210" x2="428" y2="210"/>
  </g>
  <g stroke="#dedeD6" stroke-width="1.5" stroke-dasharray="2 10" stroke-linecap="round">
    <line x1="452" y1="80" x2="600" y2="80"/><line x1="452" y1="106" x2="600" y2="106"/>
    <line x1="452" y1="132" x2="600" y2="132"/><line x1="452" y1="158" x2="600" y2="158"/>
    <line x1="452" y1="184" x2="600" y2="184"/><line x1="452" y1="210" x2="600" y2="210"/>
  </g>

  <g fill="#e07a1f" stroke="#a8560f" stroke-width="1.2">
    <circle cx="112" cy="80" r="6"/><circle cx="112" cy="106" r="6"/><circle cx="112" cy="132" r="6"/>
    <circle cx="112" cy="158" r="6"/><circle cx="112" cy="184" r="6"/><circle cx="112" cy="210" r="6"/>
    <circle cx="440" cy="80" r="6"/><circle cx="440" cy="106" r="6"/><circle cx="440" cy="132" r="6"/>
    <circle cx="440" cy="158" r="6"/><circle cx="440" cy="184" r="6"/><circle cx="440" cy="210" r="6"/>
  </g>
  <line x1="440" y1="68" x2="440" y2="222" stroke="#a8560f" stroke-width="1.6" stroke-dasharray="5 4"/>

  <g font-size="12" fill="#6a6f76" text-anchor="end">
    <text x="94" y="84">1</text><text x="94" y="110">2</text><text x="94" y="136">3</text>
    <text x="94" y="162">4</text><text x="94" y="188">5</text><text x="94" y="214">6</text>
  </g>
  <g font-size="12.5" fill="#4a4f56">
    <text x="112" y="60" text-anchor="middle">start</text>
    <text x="440" y="60" text-anchor="middle">stop line</text>
    <text x="600" y="60" text-anchor="end">run off</text>
  </g>

  <g stroke="#8b9099" stroke-width="1.2">
    <line x1="112" y1="240" x2="440" y2="240"/><line x1="112" y1="234" x2="112" y2="246"/>
    <line x1="440" y1="234" x2="440" y2="246"/>
    <line x1="440" y1="240" x2="600" y2="240"/><line x1="600" y1="234" x2="600" y2="246"/>
  </g>
  <rect x="238" y="231" width="76" height="18" fill="#fcfcf8"/>
  <text x="276" y="245" font-size="12.5" fill="#4a4f56" text-anchor="middle">10 metres</text>
  <rect x="494" y="231" width="52" height="18" fill="#fcfcf8"/>
  <text x="520" y="245" font-size="12.5" fill="#4a4f56" text-anchor="middle">5 metres</text>

  <g>
    <circle cx="672" cy="145" r="9" fill="#3f7f5b"/>
    <text x="672" y="172" font-size="12" fill="#4a4f56" text-anchor="middle">coach,</text>
    <text x="672" y="188" font-size="12" fill="#4a4f56" text-anchor="middle">facing them</text>
  </g>

  <text x="112" y="284" font-size="12.5" fill="#4a4f56">a disc each, beside the lanes</text>
  <g fill="#bcd8f5" stroke="#4b7fc4" stroke-width="1.1">
    <circle cx="120" cy="308" r="5"/><circle cx="156" cy="308" r="5"/><circle cx="192" cy="308" r="5"/>
    <circle cx="228" cy="308" r="5"/><circle cx="264" cy="308" r="5"/><circle cx="300" cy="308" r="5"/>
    <circle cx="336" cy="308" r="5"/><circle cx="372" cy="308" r="5"/><circle cx="408" cy="308" r="5"/>
    <circle cx="120" cy="332" r="5"/><circle cx="156" cy="332" r="5"/><circle cx="192" cy="332" r="5"/>
    <circle cx="228" cy="332" r="5"/><circle cx="264" cy="332" r="5"/><circle cx="300" cy="332" r="5"/>
    <circle cx="336" cy="332" r="5"/><circle cx="372" cy="332" r="5"/><circle cx="408" cy="332" r="5"/>
  </g>
</svg>
