<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="349" rx="6" fill="#fcfcf8" stroke="#d8d8d0"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#22262b">A mini hurdle in the middle of each lane</text>

  <g stroke="#c6c6bd" stroke-width="1.5" stroke-dasharray="3 9" stroke-linecap="round">
    <line x1="122" y1="80" x2="338" y2="80"/><line x1="382" y1="80" x2="598" y2="80"/>
    <line x1="122" y1="106" x2="338" y2="106"/><line x1="382" y1="106" x2="598" y2="106"/>
    <line x1="122" y1="132" x2="338" y2="132"/><line x1="382" y1="132" x2="598" y2="132"/>
    <line x1="122" y1="158" x2="338" y2="158"/><line x1="382" y1="158" x2="598" y2="158"/>
    <line x1="122" y1="184" x2="338" y2="184"/><line x1="382" y1="184" x2="598" y2="184"/>
    <line x1="122" y1="210" x2="338" y2="210"/><line x1="382" y1="210" x2="598" y2="210"/>
  </g>

  <g fill="#e07a1f" stroke="#a8560f" stroke-width="1.2">
    <circle cx="112" cy="80" r="6"/><circle cx="608" cy="80" r="6"/>
    <circle cx="112" cy="106" r="6"/><circle cx="608" cy="106" r="6"/>
    <circle cx="112" cy="132" r="6"/><circle cx="608" cy="132" r="6"/>
    <circle cx="112" cy="158" r="6"/><circle cx="608" cy="158" r="6"/>
    <circle cx="112" cy="184" r="6"/><circle cx="608" cy="184" r="6"/>
    <circle cx="112" cy="210" r="6"/><circle cx="608" cy="210" r="6"/>
  </g>

  <g fill="#6b4fa8" stroke="#4a3579" stroke-width="1">
    <rect x="346" y="74" width="28" height="7" rx="2"/><rect x="346" y="100" width="28" height="7" rx="2"/>
    <rect x="346" y="126" width="28" height="7" rx="2"/><rect x="346" y="152" width="28" height="7" rx="2"/>
    <rect x="346" y="178" width="28" height="7" rx="2"/><rect x="346" y="204" width="28" height="7" rx="2"/>
  </g>

  <g font-size="12" fill="#6a6f76" text-anchor="end">
    <text x="94" y="84">1</text><text x="94" y="110">2</text><text x="94" y="136">3</text>
    <text x="94" y="162">4</text><text x="94" y="188">5</text><text x="94" y="214">6</text>
  </g>
  <g font-size="12.5" fill="#4a4f56">
