    <text x="360" y="60" text-anchor="middle">hurdle, 15 cm</text>
    <text x="608" y="60" text-anchor="middle">finish</text>
  </g>

  <g stroke="#8b9099" stroke-width="1.2">
    <line x1="112" y1="240" x2="360" y2="240"/><line x1="112" y1="234" x2="112" y2="246"/>
    <line x1="360" y1="234" x2="360" y2="246"/>
    <line x1="360" y1="240" x2="608" y2="240"/><line x1="608" y1="234" x2="608" y2="246"/>
  </g>
  <rect x="198" y="231" width="76" height="18" fill="#fcfcf8"/>
  <text x="236" y="245" font-size="12.5" fill="#4a4f56" text-anchor="middle">7 metres</text>
  <rect x="446" y="231" width="76" height="18" fill="#fcfcf8"/>
  <text x="484" y="245" font-size="12.5" fill="#4a4f56" text-anchor="middle">7 metres</text>

  <text x="112" y="284" font-size="12.5" fill="#4a4f56">a disc each, beside the lanes</text>
  <g fill="#bcd8f5" stroke="#4b7fc4" stroke-width="1.1">
    <circle cx="120" cy="308" r="5"/><circle cx="156" cy="308" r="5"/><circle cx="192" cy="308" r="5"/>
    <circle cx="228" cy="308" r="5"/><circle cx="264" cy="308" r="5"/><circle cx="300" cy="308" r="5"/>
    <circle cx="336" cy="308" r="5"/><circle cx="372" cy="308" r="5"/><circle cx="408" cy="308" r="5"/>
    <circle cx="120" cy="332" r="5"/><circle cx="156" cy="332" r="5"/><circle cx="192" cy="332" r="5"/>
