<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 356" width="744" height="356" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="743" height="355" rx="6" fill="#fcfcf8" stroke="#d8d8d0"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#22262b">8-cone snake: sprint, shuffle, sprint</text>
  <text x="24" y="56" font-size="12.5" fill="#6a6f76">sprint to cone 2, stay low and shuffle the zigzag, plant and sprint out</text>
  <circle cx="70" cy="190" r="7" fill="#bcd8f5" stroke="#4b7fc4" stroke-width="1.2"/>
  <text x="70" y="214" font-size="12.5" fill="#4a4f56" text-anchor="middle" font-weight="400">start</text>
  <g stroke="#e07a1f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 86 190 L 144 190"/><path d="M 135.8 193.7 L 144 190 L 135.8 186.3"/></g>
  <text x="115.0" y="178" font-size="12" fill="#e07a1f" text-anchor="middle" font-weight="700">sprint</text>
  <circle cx="160" cy="190" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <circle cx="250" cy="130" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <circle cx="340" cy="250" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <circle cx="430" cy="130" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <circle cx="520" cy="250" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <circle cx="600" cy="190" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <g stroke="#e07a1f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 172 182 L 238 138"/><path d="M 233.2 145.6 L 238 138 L 229.1 139.5"/></g>
  <g stroke="#e07a1f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 262 142 L 328 238"/><path d="M 320.3 233.3 L 328 238 L 326.4 229.1"/></g>
  <g stroke="#e07a1f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 352 238 L 418 142"/><path d="M 416.4 150.9 L 418 142 L 410.3 146.7"/></g>
  <g stroke="#e07a1f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 442 142 L 508 238"/><path d="M 500.3 233.3 L 508 238 L 506.4 229.1"/></g>
  <g stroke="#e07a1f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 532 242 L 588 198"/><path d="M 583.8 206.0 L 588 198 L 579.3 200.2"/></g>
  <circle cx="685" cy="190" r="7" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1.2"/>
  <g stroke="#e07a1f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 616 190 L 669 190"/><path d="M 660.8 193.7 L 669 190 L 660.8 186.3"/></g>
  <text x="642.5" y="178" font-size="12" fill="#e07a1f" text-anchor="middle" font-weight="700">sprint out</text>
  <text x="685" y="214" font-size="12.5" fill="#4a4f56" text-anchor="middle" font-weight="400">finish</text>
  <text x="160" y="214" font-size="11.5" fill="#6a6f76" text-anchor="middle" font-weight="400">break down</text>
  <text x="250" y="116" font-size="11.5" fill="#6a6f76" text-anchor="middle" font-weight="400">plant outside foot</text>
  <text x="340" y="274" font-size="11.5" fill="#6a6f76" text-anchor="middle" font-weight="400">stay low</text>
  <text x="430" y="116" font-size="11.5" fill="#6a6f76" text-anchor="middle" font-weight="400">face downfield</text>
  <text x="520" y="274" font-size="11.5" fill="#6a6f76" text-anchor="middle" font-weight="400">plant outside foot</text>
  <text x="600" y="214" font-size="11.5" fill="#6a6f76" text-anchor="middle" font-weight="400">plant &amp; go</text>
  <g stroke="#8b9099" stroke-width="1.2"><line x1="70" y1="298" x2="685" y2="298"/><line x1="70" y1="292" x2="70" y2="304"/><line x1="685" y1="292" x2="685" y2="304"/></g>
  <rect x="339.5" y="289" width="76" height="18" fill="#fcfcf8"/>
  <text x="377.5" y="302" font-size="12.5" fill="#4a4f56" text-anchor="middle" font-weight="400">about 20 metres</text>
  <text x="372" y="338" font-size="13" fill="#6a6f76" text-anchor="middle" font-weight="400">Walk back around the outside. Full rest before the next go.</text>
</svg>
