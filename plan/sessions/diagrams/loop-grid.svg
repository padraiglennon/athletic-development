<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 356" width="744" height="356" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="743" height="355" rx="6" fill="#fcfcf8" stroke="#d8d8d0"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#22262b">One loop, about 70 metres round</text>
  <text x="24" y="56" font-size="12.5" fill="#6a6f76">everybody runs the same way at the same time, and nobody stops</text>
