  <g stroke="#e07a1f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 360 302 L 300 302"/><path d="M 308.2 298.3 L 300 302 L 308.2 305.7"/></g>
  <g stroke="#e07a1f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 642 160 L 642 220"/><path d="M 638.3 211.8 L 642 220 L 645.7 211.8"/></g>
