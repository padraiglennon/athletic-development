  <text x="372" y="176" font-size="13" fill="#4a4f56" text-anchor="middle" font-weight="400">Slower boys run the inside of the corners.</text>
  <text x="372" y="200" font-size="13" fill="#4a4f56" text-anchor="middle" font-weight="400">Nobody laps anybody. Keep the line moving.</text>
  <g stroke="#8b9099" stroke-width="1.2"><line x1="118" y1="330" x2="626" y2="330"/><line x1="118" y1="324" x2="118" y2="336"/><line x1="626" y1="324" x2="626" y2="336"/></g>
  <rect x="334.0" y="321" width="76" height="18" fill="#fcfcf8"/>
  <text x="372.0" y="334" font-size="12.5" fill="#4a4f56" text-anchor="middle" font-weight="400">about 25 metres</text>
