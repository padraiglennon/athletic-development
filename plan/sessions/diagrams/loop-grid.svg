  <circle cx="626" cy="190" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <circle cx="250" cy="92" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <circle cx="400" cy="92" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <circle cx="250" cy="288" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
  <circle cx="400" cy="288" r="6" fill="#e07a1f" stroke="#a8560f" stroke-width="1.2"/>
