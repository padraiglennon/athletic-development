<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 320" width="744" height="320" font-family="Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="743" height="319" rx="6" fill="#fcfcf8" stroke="#d8d8d0"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#22262b">Talking pace, and how to check it</text>
  <text x="24" y="56" font-size="12.5" fill="#6a6f76">run beside a boy and ask him his name and his club</text>
  <rect x="118" y="86" width="127" height="54" fill="#e8eae7" stroke="#d8d8d0"/>
  <text x="181.5" y="118" font-size="13.5" fill="#22262b" text-anchor="middle" font-weight="700">walking</text>
  <rect x="245" y="86" width="127" height="54" fill="#a9d9ba" stroke="#d8d8d0"/>
  <text x="308.5" y="118" font-size="13.5" fill="#22262b" text-anchor="middle" font-weight="700">talking pace</text>
  <rect x="372" y="86" width="127" height="54" fill="#f0d987" stroke="#d8d8d0"/>
  <text x="435.5" y="118" font-size="13.5" fill="#22262b" text-anchor="middle" font-weight="700">puffing</text>
  <rect x="499" y="86" width="127" height="54" fill="#e8807c" stroke="#d8d8d0"/>
  <text x="562.5" y="118" font-size="13.5" fill="#22262b" text-anchor="middle" font-weight="700">all out</text>
  <rect x="245" y="86" width="127" height="54" fill="none" stroke="#2f7d4f" stroke-width="3"/>
  <g stroke="#2f7d4f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 308 176 L 308 148"/><path d="M 311.7 156.2 L 308 148 L 304.3 156.2"/></g>
  <text x="308" y="200" font-size="14" fill="#22262b" text-anchor="middle" font-weight="700">Every endurance night lives in this band.</text>
  <text x="118" y="232" font-size="13.5" fill="#4a4f56" text-anchor="start" font-weight="400">He answers in a full sentence: he is too easy. Tell him to push on.</text>
  <text x="118" y="256" font-size="13.5" fill="#4a4f56" text-anchor="start" font-weight="400">He answers in short words: that is the band. Leave him alone.</text>
  <text x="118" y="280" font-size="13.5" fill="#4a4f56" text-anchor="start" font-weight="400">He cannot answer: he is too hard. Tell him to ease off, do not stop him.</text>
</svg>
